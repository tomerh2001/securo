name: Publish Home Server Images

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  actions: read
  packages: write

# Never cancel a publication halfway through updating the deployment tags.
concurrency:
  group: home-server-images
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.repository == 'tomerh2001/securo' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the completed CI run and current main
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/scripts/verify_home_server_publication.py

  build:
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - name: Read the upstream application version
        id: version
        run: |
          python3 - <<'PY'
          import json, os, re
          version = json.load(open('frontend/package.json'))['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/securo-${{ matrix.component }}:sha-${{ needs.verify.outputs.sha }}
          build-args: |
            VITE_APP_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  promote:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recheck current main after both images have built
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 backend/scripts/verify_home_server_publication.py
      - name: Promote the verified backend and frontend together
        if: steps.gate.outputs.publish == 'true' && steps.gate.outputs.sha == needs.verify.outputs.sha
        env:
          REVISION: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          for component in backend frontend; do
            image="ghcr.io/tomerh2001/securo-$component"
            docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image:sha-$REVISION"
          done
          printf 'Published both application images for `%s`.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
